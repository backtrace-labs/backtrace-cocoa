name: Build and deploy release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-rc'
      - '[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read

jobs:
  validate-release-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      source_version: ${{ steps.validate.outputs.source_version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
      head: ${{ steps.validate.outputs.head }}

    steps:
      - name: Checkout immutable release event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate release version sources
        id: validate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_version="$(scripts/release-source-version.sh "$RELEASE_TAG")"
          scripts/validate-release-version.sh "$source_version"
          if [[ "$RELEASE_TAG" == "$source_version" ]]; then
            prerelease=false
          else
            prerelease=true
          fi
          echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_version=$source_version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # test is copied pasted from test.yml - do in a clean way in the future
  # BEGIN COPY PASTE FROM TEST.YML
  swift-package:
    name: Build and test Swift package
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned Xcode
        run: |
          xcode_version_output="$(xcodebuild -version)"
          test "${xcode_version_output%%$'\n'*}" = "Xcode 26.3"
      - name: Test Swift package and compiled resources
        run: |
          xcodebuild \
            -workspace SwiftPMIntegration.xcworkspace \
            -scheme Backtrace-Tests \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/backtrace-spm-derived" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test

  test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    
    strategy:
      fail-fast: false
      matrix:
          platform: [ios, mac, tvos]

    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned Xcode
        run: |
          xcode_version_output="$(xcodebuild -version)"
          test "${xcode_version_output%%$'\n'*}" = "Xcode 26.3"
      - name: Install dependencies
        run: sh scripts/install.sh
      - name: Run test
        run: fastlane ${{ matrix.platform }} tests
    
  pod-lint:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned Xcode
        run: |
          xcode_version_output="$(xcodebuild -version)"
          test "${xcode_version_output%%$'\n'*}" = "Xcode 26.3"
      - name: Install dependencies
        run: sh scripts/install.sh
      - name: Run pod lib lint
        run: pod lib lint --verbose --allow-warnings --sources='https://cdn.cocoapods.org/' 
  # END COPY PASTE FROM TEST.YML

  deploy-cocoapods:
    runs-on: macos-26
    needs: [validate-release-tag, upload-xcframeworks]
    # Release-candidate tags validate and publish draft artifacts only. Publishing
    # the podspec's stable version is reserved for the exact N.N.N tag.
    if: needs.validate-release-tag.outputs.prerelease == 'false'
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release-tag.outputs.head }}
      - name: Verify validated release revision
        env:
          EXPECTED_HEAD: ${{ needs.validate-release-tag.outputs.head }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Verify release tag still resolves to the validated revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.version }}
          EXPECTED_HEAD: ${{ needs.validate-release-tag.outputs.head }}
        run: |
          set -euo pipefail
          read -r tag_type tag_sha <<< "$(gh api \
            "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
            --jq '.object | "\(.type) \(.sha)"')"
          for tag_level in 1 2 3 4 5; do
            test "$tag_type" = "tag" || break
            read -r tag_type tag_sha <<< "$(gh api \
              "repos/$GH_REPO/git/tags/$tag_sha" \
              --jq '.object | "\(.type) \(.sha)"')"
          done
          test "$tag_type" = "commit"
          test "$tag_sha" = "$EXPECTED_HEAD"
      - name: Verify stable CocoaPods publication tag
        env:
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.version }}
          SOURCE_VERSION: ${{ needs.validate-release-tag.outputs.source_version }}
        run: test "$RELEASE_TAG" = "$SOURCE_VERSION"
      - name: Verify pinned Xcode
        run: |
          xcode_version_output="$(xcodebuild -version)"
          test "${xcode_version_output%%$'\n'*}" = "Xcode 26.3"
      - name: Install dependencies
        run: sh scripts/install.sh
      - name: Deploy to Cocoapods
        run: sh scripts/deploy.sh
        env:
         COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}

  sign-and-build-frameworks:
    runs-on: macos-26
    needs: [validate-release-tag, pod-lint, swift-package, test]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release-tag.outputs.head }}
      - name: Verify validated release revision
        env:
          EXPECTED_HEAD: ${{ needs.validate-release-tag.outputs.head }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Verify pinned Xcode
        run: |
          xcode_version_output="$(xcodebuild -version)"
          test "${xcode_version_output%%$'\n'*}" = "Xcode 26.3"
      - name: Install pods
        run: pod install
      - name: Install the Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64_2026: ${{ secrets.BUILD_CERTIFICATE_BASE64_2026 }}
          BUILD_PROVISION_PROFILE_BASE64_2026: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64_2026 }}
          MAC_BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64_2026 }}
          MAC_BUILD_PROVISION_PROFILE_BASE64_2026: ${{ secrets.MAC_BUILD_PROVISION_PROFILE_BASE64_2026 }}
          P12_PASSWORD_2026: ${{ secrets.P12_PASSWORD_2026 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision

          MAC_CERTIFICATE_PATH=$RUNNER_TEMP/mac_build_certificate.p12
          MAC_PP_PATH=$RUNNER_TEMP/mac_build_pp.provisionprofile

          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import iOS certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64_2026" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64_2026" | base64 --decode -o $PP_PATH

          # import macOS certificate and provisioning profile from secrets
          echo -n "$MAC_BUILD_CERTIFICATE_BASE64" | base64 --decode -o $MAC_CERTIFICATE_PATH
          echo -n "$MAC_BUILD_PROVISION_PROFILE_BASE64_2026" | base64 --decode -o $MAC_PP_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import iOS certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD_2026" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # import macOS certificate to keychain
          security import $MAC_CERTIFICATE_PATH -P "$P12_PASSWORD_2026" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
          cp $MAC_PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build frameworks
        run: sh scripts/xcframeworkgen.sh
        env:
          BACKTRACE_VERSION: ${{ needs.validate-release-tag.outputs.source_version }}
          
      - name: Codesign frameworks
        env:
          DISTRIBUTION_IDENTITY: ${{ secrets.DISTRIBUTION_IDENTITY }}
        run: |
          codesign --force --timestamp --sign "$DISTRIBUTION_IDENTITY" frameworks/Backtrace.xcframework
          codesign --force --timestamp --sign "$DISTRIBUTION_IDENTITY" frameworks/PLCrashReporter/CrashReporter.xcframework  

      - name: Tar files to preserve file permissions
        run: tar -cvzf Archive_XCFrameworks_${{ github.ref_name }}.tar.gz frameworks/

      - uses: actions/upload-artifact@v4
        with:
          name: Archive_XCFrameworks_${{ github.ref_name }}
          path: Archive_XCFrameworks_${{ github.ref_name }}.tar.gz    
        
  upload-xcframeworks:
    runs-on: ubuntu-latest
    needs: [validate-release-tag, sign-and-build-frameworks]
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download signed XCFrameworks
        uses: actions/download-artifact@v4
        with:
          name: Archive_XCFrameworks_${{ github.ref_name }}
          path: artifacts/

      - name: Upload exact-tag release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate-release-tag.outputs.version }}
          PRERELEASE: ${{ needs.validate-release-tag.outputs.prerelease }}
          EXPECTED_HEAD: ${{ needs.validate-release-tag.outputs.head }}
        run: |
          set -euo pipefail

          framework_archive="artifacts/Archive_XCFrameworks_${RELEASE_TAG}.tar.gz"

          test -f "$framework_archive"
          tar -tzf "$framework_archive" >/dev/null

          read -r tag_type tag_sha <<< "$(gh api \
            "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
            --jq '.object | "\(.type) \(.sha)"')"
          for tag_level in 1 2 3 4 5; do
            test "$tag_type" = "tag" || break
            read -r tag_type tag_sha <<< "$(gh api \
              "repos/$GH_REPO/git/tags/$tag_sha" \
              --jq '.object | "\(.type) \(.sha)"')"
          done
          test "$tag_type" = "commit"
          test "$tag_sha" = "$EXPECTED_HEAD"

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$PRERELEASE" == "true" ]]; then
              gh release create "$RELEASE_TAG" \
                --draft \
                --prerelease \
                --notes "" \
                --title "$RELEASE_TAG" \
                --verify-tag
            else
              gh release create "$RELEASE_TAG" \
                --draft \
                --notes "" \
                --title "$RELEASE_TAG" \
                --verify-tag
            fi
          else
            existing_prerelease="$(gh release view "$RELEASE_TAG" \
              --json isPrerelease \
              --jq '.isPrerelease')"
            test "$existing_prerelease" = "$PRERELEASE"
          fi

          gh release upload "$RELEASE_TAG" \
            "$framework_archive" \
            --clobber
